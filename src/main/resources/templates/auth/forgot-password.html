<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - Thư Viện Số</title>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('library_theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary: #36A4F7;
            --primary-hover: #178DE5;
            --primary-border: #BAE0FD;
            --bg-body: #F4F6F9;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(#CBD5E1 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }
        .back-home {
            position: fixed; top: 1.5rem; left: 2rem;
            display: inline-flex; align-items: center; gap: 0.5rem;
            font-size: 0.875rem; font-weight: 600; color: var(--text-muted);
            text-decoration: none; padding: 0.5rem 0.95rem;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(8px);
            border: 1px solid var(--border-color); border-radius: 9999px;
            transition: all 0.2s ease; z-index: 100;
        }
        .back-home:hover { color: var(--primary); border-color: var(--primary-border); transform: translateX(-3px); }
        .auth-card {
            width: 100%; max-width: 440px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 45px -10px rgba(15,23,42,0.12);
            padding: 2.5rem 2.25rem;
        }
        .brand-header {
            display: inline-flex; align-items: center; gap: 0.65rem;
            text-decoration: none; margin-bottom: 1.75rem;
        }
        .brand-icon {
            width: 38px; height: 38px; background: var(--primary); color: white;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; box-shadow: 0 4px 10px rgba(54,164,247,0.3);
        }
        .brand-title { font-size: 1.2rem; font-weight: 700; color: var(--text-main); }
        h1 { font-size: 1.85rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem; letter-spacing: -0.03em; }
        .subtitle { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 1.75rem; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.45rem; }
        .input-wrap { position: relative; }
        .input-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94A3B8; font-size: 1rem; pointer-events: none; }
        .form-control {
            width: 100%; padding: 0.75rem 1rem 0.75rem 2.6rem;
            font-family: inherit; font-size: 0.9rem; color: var(--text-main);
            background: #fff; border: 1px solid var(--border-color); border-radius: 10px;
            outline: none; transition: all 0.2s;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(54,164,247,0.15); }
        .form-control::placeholder { color: #94A3B8; }
        .btn-submit {
            width: 100%; padding: 0.85rem; background: var(--primary); color: white;
            border: none; border-radius: 10px; font-family: inherit; font-size: 0.95rem;
            font-weight: 600; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(54,164,247,0.25); transition: all 0.2s;
            margin-top: 1.25rem;
        }
        .btn-submit:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .alert {
            padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.825rem;
            margin-bottom: 1.25rem; display: flex; align-items: flex-start; gap: 0.5rem;
        }
        .alert-danger { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
        .alert-success { background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
        .divider { border: none; border-top: 1px solid var(--border-color); margin: 1.5rem 0; }
        .link-row { text-align: center; font-size: 0.875rem; color: var(--text-muted); }
        .link-row a { color: var(--primary); font-weight: 700; text-decoration: none; }
        .link-row a:hover { color: var(--primary-hover); }
        .icon-circle {
            width: 64px; height: 64px; background: #EFF6FF; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.75rem; color: var(--primary); margin-bottom: 1.25rem;
        }
        [data-bs-theme="dark"] {
            --bg-body: #0B0E14; --card-bg: #121722; --text-main: #F8FAFC;
            --text-muted: #94A3B8; --border-color: rgba(255,255,255,0.08);
        }
        [data-bs-theme="dark"] body { background-color: #0B0E14; background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px); }
        [data-bs-theme="dark"] .auth-card { background: #121722; border-color: rgba(255,255,255,0.08); }
        [data-bs-theme="dark"] .form-control { background: #0B0E14; border-color: rgba(255,255,255,0.12); color: #F8FAFC; }
        [data-bs-theme="dark"] .form-control:focus { background: #0E131C; border-color: var(--primary); }
        [data-bs-theme="dark"] .icon-circle { background: rgba(56,189,248,0.12); color: #38BDF8; }
        [data-bs-theme="dark"] .back-home { background: rgba(18,23,34,0.85); border-color: rgba(255,255,255,0.1); color: #CBD5E1; }
        [data-bs-theme="dark"] .alert-danger { background: rgba(239,68,68,0.15); color: #FCA5A5; border-color: rgba(239,68,68,0.3); }
        [data-bs-theme="dark"] .alert-success { background: rgba(16,185,129,0.15); color: #6EE7B7; border-color: rgba(16,185,129,0.3); }
    </style>
</head>
<body>
    <a href="/login" class="back-home"><i class="bi bi-arrow-left"></i> Quay lại đăng nhập</a>

    <div class="auth-card">
        <a href="/" class="brand-header">
            <div class="brand-icon"><i class="bi bi-book-half"></i></div>
            <span class="brand-title">Thư viện số</span>
        </a>

        <div class="icon-circle"><i class="bi bi-shield-lock"></i></div>
        <h1>Quên mật khẩu?</h1>
        <p class="subtitle">Nhập địa chỉ email đã đăng ký. Hệ thống sẽ gửi hướng dẫn đặt lại mật khẩu cho bạn.</p>

        <div th:if="${errorMessage}" class="alert alert-danger">
            <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
            <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="bi bi-check-circle-fill flex-shrink-0"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div>
                <label class="form-label" for="email">Địa chỉ Email</label>
                <div class="input-wrap">
                    <i class="bi bi-envelope input-icon"></i>
                    <input type="email" id="email" name="email" class="form-control"
                           placeholder="Nhập email đã đăng ký" required autofocus>
                </div>
            </div>
            <button type="submit" class="btn-submit">
                <i class="bi bi-send"></i>
                <span>Gửi yêu cầu đặt lại</span>
            </button>
        </form>

        <hr class="divider">
        <div class="link-row">
            Nhớ mật khẩu rồi? <a href="/login">Đăng nhập ngay</a>
        </div>
    </div>
</body>
</html>
