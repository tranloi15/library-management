<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu - Thư Viện Số</title>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('library_theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary: #36A4F7; --primary-hover: #178DE5;
            --primary-border: #BAE0FD; --bg-body: #F4F6F9;
            --card-bg: #FFFFFF; --text-main: #0F172A;
            --text-muted: #64748B; --border-color: #E2E8F0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(#CBD5E1 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 2rem 1.5rem;
        }
        .back-home {
            position: fixed; top: 1.5rem; left: 2rem;
            display: inline-flex; align-items: center; gap: 0.5rem;
            font-size: 0.875rem; font-weight: 600; color: var(--text-muted);
            text-decoration: none; padding: 0.5rem 0.95rem;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(8px);
            border: 1px solid var(--border-color); border-radius: 9999px;
            transition: all 0.2s; z-index: 100;
        }
        .back-home:hover { color: var(--primary); border-color: var(--primary-border); transform: translateX(-3px); }
        .auth-card {
            width: 100%; max-width: 460px; background: var(--card-bg);
            border-radius: 20px; border: 1px solid var(--border-color);
            box-shadow: 0 20px 45px -10px rgba(15,23,42,0.12);
            padding: 2.5rem 2.25rem;
        }
        .brand-header {
            display: inline-flex; align-items: center; gap: 0.65rem;
            text-decoration: none; margin-bottom: 1.75rem;
        }
        .brand-icon {
            width: 38px; height: 38px; background: var(--primary); color: white;
            border-radius: 10px; display: flex; align-items: center;
            justify-content: center; font-size: 1.25rem;
        }
        .brand-title { font-size: 1.2rem; font-weight: 700; color: var(--text-main); }
        .icon-circle {
            width: 64px; height: 64px; background: #F0FDF4; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.75rem; color: #10B981; margin-bottom: 1.25rem;
        }
        h1 { font-size: 1.85rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem; letter-spacing: -0.03em; }
        .subtitle { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 1.75rem; }
        .form-group { margin-bottom: 1.15rem; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.45rem; }
        .input-wrap { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 1rem; color: #94A3B8; font-size: 1rem; pointer-events: none; }
        .toggle-pw { position: absolute; right: 1rem; color: #94A3B8; cursor: pointer; font-size: 1rem; border: none; background: none; }
        .toggle-pw:hover { color: var(--primary); }
        .form-control {
            width: 100%; padding: 0.75rem 2.75rem 0.75rem 2.6rem;
            font-family: inherit; font-size: 0.9rem; color: var(--text-main);
            background: #fff; border: 1px solid var(--border-color);
            border-radius: 10px; outline: none; transition: all 0.2s;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(54,164,247,0.15); }
        .form-hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.35rem; }
        .strength-bar { height: 4px; border-radius: 2px; background: #E2E8F0; margin-top: 0.5rem; overflow: hidden; }
        .strength-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0%; }
        .btn-submit {
            width: 100%; padding: 0.85rem; background: var(--primary); color: white;
            border: none; border-radius: 10px; font-family: inherit; font-size: 0.95rem;
            font-weight: 600; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(54,164,247,0.25); transition: all 0.2s;
            margin-top: 1.25rem;
        }
        .btn-submit:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .alert {
            padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.825rem;
            margin-bottom: 1.25rem; display: flex; align-items: flex-start; gap: 0.5rem;
        }
        .alert-danger { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
        .alert-success { background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
        .alert-warning { background: #FFFBEB; color: #92400E; border: 1px solid #FDE68A; }
        .divider { border: none; border-top: 1px solid var(--border-color); margin: 1.5rem 0; }
        .link-row { text-align: center; font-size: 0.875rem; color: var(--text-muted); }
        .link-row a { color: var(--primary); font-weight: 700; text-decoration: none; }
        .token-invalid { text-align: center; padding: 1.5rem 0; }
        [data-bs-theme="dark"] {
            --bg-body: #0B0E14; --card-bg: #121722; --text-main: #F8FAFC;
            --text-muted: #94A3B8; --border-color: rgba(255,255,255,0.08);
        }
        [data-bs-theme="dark"] body { background-color: #0B0E14; background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px); }
        [data-bs-theme="dark"] .auth-card { background: #121722; border-color: rgba(255,255,255,0.08); }
        [data-bs-theme="dark"] .form-control { background: #0B0E14; border-color: rgba(255,255,255,0.12); color: #F8FAFC; }
        [data-bs-theme="dark"] .form-control:focus { background: #0E131C; }
        [data-bs-theme="dark"] .strength-bar { background: rgba(255,255,255,0.1); }
        [data-bs-theme="dark"] .back-home { background: rgba(18,23,34,0.85); border-color: rgba(255,255,255,0.1); color: #CBD5E1; }
        [data-bs-theme="dark"] .icon-circle { background: rgba(16,185,129,0.12); }
        [data-bs-theme="dark"] .alert-danger { background: rgba(239,68,68,0.15); color: #FCA5A5; border-color: rgba(239,68,68,0.3); }
        [data-bs-theme="dark"] .alert-success { background: rgba(16,185,129,0.15); color: #6EE7B7; border-color: rgba(16,185,129,0.3); }
        [data-bs-theme="dark"] .alert-warning { background: rgba(245,158,11,0.15); color: #FCD34D; border-color: rgba(245,158,11,0.3); }
    </style>
</head>
<body>
    <a href="/forgot-password" class="back-home"><i class="bi bi-arrow-left"></i> Quay lại</a>

    <div class="auth-card">
        <a href="/" class="brand-header">
            <div class="brand-icon"><i class="bi bi-book-half"></i></div>
            <span class="brand-title">Thư viện số</span>
        </a>

        <div class="icon-circle"><i class="bi bi-key"></i></div>
        <h1>Đặt lại mật khẩu</h1>
        <p class="subtitle">Nhập mật khẩu mới cho tài khoản của bạn. Mật khẩu phải có ít nhất 6 ký tự.</p>

        <div th:if="${errorMessage}" class="alert alert-danger">
            <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
            <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success">
            <i class="bi bi-check-circle-fill flex-shrink-0"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <!-- Token hợp lệ: hiển thị form -->
        <div th:if="${token != null}">
            <form th:action="@{/reset-password}" method="post" id="resetForm">
                <input type="hidden" name="token" th:value="${token}">

                <div class="form-group">
                    <label class="form-label" for="newPassword">Mật khẩu mới</label>
                    <div class="input-wrap">
                        <i class="bi bi-lock input-icon"></i>
                        <input type="password" id="newPassword" name="newPassword" class="form-control"
                               placeholder="Tối thiểu 6 ký tự" required minlength="6"
                               oninput="checkStrength(this.value); checkMatch();">
                        <button type="button" class="toggle-pw" onclick="togglePw('newPassword', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                    <div class="form-hint" id="strengthText">Nhập mật khẩu để kiểm tra độ mạnh</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label>
                    <div class="input-wrap">
                        <i class="bi bi-check2-square input-icon"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                               placeholder="Nhập lại mật khẩu mới" required
                               oninput="checkMatch();">
                        <button type="button" class="toggle-pw" onclick="togglePw('confirmPassword', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="form-hint" id="matchHint"></div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn" disabled>
                    <i class="bi bi-shield-check"></i>
                    <span>Xác nhận đặt lại mật khẩu</span>
                </button>
            </form>
        </div>

        <!-- Token không hợp lệ: thông báo -->
        <div th:if="${token == null}" class="token-invalid">
            <div class="alert alert-warning">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                <span>Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn. Vui lòng yêu cầu lại.</span>
            </div>
            <a href="/forgot-password" style="color: var(--primary); font-weight: 700; text-decoration: none;">
                <i class="bi bi-arrow-counterclockwise"></i> Yêu cầu lại
            </a>
        </div>

        <hr class="divider">
        <div class="link-row"><a href="/login">Quay lại đăng nhập</a></div>
    </div>

    <script>
        function togglePw(fieldId, btn) {
            const input = document.getElementById(fieldId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        function checkStrength(val) {
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');
            if (!fill) return;
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            const configs = [
                { w: '20%', bg: '#EF4444', label: 'Rất yếu' },
                { w: '40%', bg: '#F97316', label: 'Yếu' },
                { w: '60%', bg: '#EAB308', label: 'Trung bình' },
                { w: '80%', bg: '#22C55E', label: 'Mạnh' },
                { w: '100%', bg: '#10B981', label: 'Rất mạnh' }
            ];
            if (val.length === 0) { fill.style.width = '0'; text.textContent = 'Nhập mật khẩu để kiểm tra độ mạnh'; return; }
            const c = configs[Math.min(score - 1, 4)] || configs[0];
            fill.style.width = c.w;
            fill.style.background = c.bg;
            text.textContent = 'Độ mạnh: ' + c.label;
        }

        function checkMatch() {
            const pw = document.getElementById('newPassword');
            const cpw = document.getElementById('confirmPassword');
            const hint = document.getElementById('matchHint');
            const btn = document.getElementById('submitBtn');
            if (!pw || !cpw) return;
            if (cpw.value.length === 0) { hint.textContent = ''; if(btn) btn.disabled = true; return; }
            if (pw.value === cpw.value && pw.value.length >= 6) {
                hint.style.color = '#10B981';
                hint.textContent = '✓ Mật khẩu khớp!';
                if (btn) btn.disabled = false;
            } else {
                hint.style.color = '#EF4444';
                hint.textContent = '✗ Mật khẩu không khớp!';
                if (btn) btn.disabled = true;
            }
        }
    </script>
</body>
</html>
