<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - Thư Viện Số' : 'Thư Viện Số - Cổng Tra Cứu & Quản Lý'}">Thư Viện Số</title>

    <!-- SCRIPT KHỞI TẠO THEME SỚM (Chống giật chớp màn hình khi F5) -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('library_theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons 1.11.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS (Hưng phụ trách) -->
    <link rel="stylesheet" th:href="@{/css/custom.css(v='2.4')}" href="../../static/css/custom.css">
</head>
<body>

<div class="app-wrapper">
    <!-- Thanh Backdrop khi mở Sidebar trên Mobile -->
    <div id="sidebarBackdrop" class="d-lg-none"></div>

    <!-- 1. SIDEBAR BÊN TRÁI -->
    <div th:replace="~{layout/sidebar :: sidebar}"></div>

    <!-- 2. KHU VỰC NỘI DUNG CHÍNH -->
    <div class="app-main">
        <!-- Top Navbar -->
        <div th:replace="~{layout/navbar :: navbar}"></div>

        <!-- Vùng thân trang (Dynamic Content) -->
        <main class="content-body">
            <!-- Thông báo Flash Message -->
            <div th:replace="~{layout/alerts :: alerts}"></div>

            <!-- Vị trí nội dung các trang con sẽ đổ vào -->
            <div layout:fragment="content">
                <!-- Nội dung trang con sẽ hiển thị ở đây -->
            </div>
        </main>

        <!-- Footer Chân trang -->
        <div th:replace="~{layout/footer :: footer}"></div>
    </div>
</div>

<!-- Modal xác nhận xóa an toàn dùng chung -->
<div th:replace="~{layout/modal_confirm :: modal_confirm}"></div>

<!-- Bootstrap 5.3.3 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS (Hưng phụ trách) -->
<script th:src="@{/js/main.js}" src="../../static/js/main.js"></script>
</body>
</html>
