<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - Thư Viện Số' : 'Thư Viện Số - Cổng Tra Cứu & Quản Lý'}">Thư Viện Số</title>

    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <script>
        (function () {
            const savedTheme = localStorage.getItem('library_theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/custom.css(v='2.4')}" href="../../static/css/custom.css">
</head>
<body>

<div class="app-wrapper">
    <div id="sidebarBackdrop" class="d-lg-none"></div>

    <div th:replace="~{layout/sidebar :: sidebar}"></div>

    <div class="app-main">
        <div th:replace="~{layout/navbar :: navbar}"></div>

        <main class="content-body">
            <div th:replace="~{layout/alerts :: alerts}"></div>

            <div layout:fragment="content">
            </div>
        </main>

        <div th:replace="~{layout/footer :: footer}"></div>
    </div>
</div>

<div th:replace="~{layout/modal_confirm :: modal_confirm}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/main.js}" src="../../static/js/main.js"></script>

<th:block layout:fragment="scripts"></th:block>
</body>
</html>
