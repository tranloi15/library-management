<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modal_confirm">
    <!-- Modal Xác Nhận Xóa Dùng Chung (Safe Confirm Dialog) -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: var(--radius-lg); background-color: var(--bg-surface);">
                <div class="modal-header border-bottom-0 pb-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center pt-0 px-4 pb-4">
                    <div class="mx-auto mb-3 d-flex align-items-center justify-content-center" 
                         style="width: 60px; height: 60px; border-radius: 50%; background-color: var(--status-danger-bg); color: var(--status-danger);">
                        <i class="bi bi-trash3-fill fs-2"></i>
                    </div>
                    <h5 class="modal-title fw-bold mb-2" id="deleteConfirmModalLabel">Xác nhận xóa dữ liệu?</h5>
                    <p class="text-muted small mb-3">
                        Bạn có chắc chắn muốn xóa <span id="deleteItemName" class="fw-bold text-danger">mục này</span> không? 
                        Hành động này sẽ không thể khôi phục.
                    </p>
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-light px-4 py-2 fw-semibold" data-bs-dismiss="modal">Hủy bỏ</button>
                        <form id="deleteConfirmForm" method="post" action="#" class="m-0">
                            <button type="submit" class="btn btn-danger px-4 py-2 fw-semibold">
                                <i class="bi bi-trash me-1"></i> Đồng ý xóa
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
