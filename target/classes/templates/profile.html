<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Cá Nhân - Thư Viện Số</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        .navbar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 50; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--text-main); font-size: 1.3rem; font-weight: 800; }
        .brand-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #4f46e5, #06b6d4); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.25rem; }
        .nav-links { display: flex; align-items: center; gap: 1.25rem; }
        .nav-link { text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; }
        .nav-link.active, .nav-link:hover { color: var(--primary); }

        .content { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }

        .page-title { font-size: 1.6rem; font-weight: 800; color: #1e1b4b; margin-bottom: 1.5rem; }

        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        @media (max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); border-radius: 16px; border: 1px solid #e2e8f0; padding: 2rem; box-shadow: var(--shadow); }
        .card-title { font-size: 1.25rem; font-weight: 700; color: #1e1b4b; margin-bottom: 0.5rem; }
        .card-desc { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.5rem; }

        .alert-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #16a34a; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.875rem; }
        .alert-error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.875rem; }

        .form-group { margin-bottom: 1.15rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem; color: #334155; }
        input { width: 100%; padding: 0.7rem 0.9rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.9rem; font-family: inherit; outline: none; transition: all 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
        input[readonly] { background-color: #f1f5f9; cursor: not-allowed; }

        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.65rem 1.25rem; font-size: 0.9rem; font-weight: 700; border-radius: 8px; text-decoration: none; cursor: pointer; transition: all 0.2s ease; border: none; }
        .btn-primary { background: var(--primary); color: white; width: 100%; margin-top: 0.5rem; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-outline { border: 1px solid #cbd5e1; background: white; color: var(--text-main); }
        .btn-outline:hover { background: #f1f5f9; }

        .badge-role { display: inline-block; padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: 700; background: #e0e7ff; color: var(--primary); margin-top: 0.25rem; }

        footer { background: white; border-top: 1px solid #e2e8f0; text-align: center; padding: 1.5rem; color: var(--text-muted); font-size: 0.875rem; margin-top: 3rem; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="brand">
                <div class="brand-icon">📚</div>
                <span>Thư Viện Số</span>
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-link">Trang chủ</a>
                <a th:if="${user.role.name() == 'ROLE_ADMIN'}" href="/users" class="nav-link">Quản lý Độc giả</a>
                <a th:if="${user.role.name() == 'ROLE_READER'}" href="/borrow/history" class="nav-link">Lịch sử mượn</a>
                <a href="/profile" class="nav-link active">Tài khoản</a>
                <form th:action="@{/logout}" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Đăng xuất</button>
                </form>
            </nav>
        </div>
    </header>

    <main class="content">
        <h1 class="page-title">Hồ Sơ Cá Nhân</h1>

        <div class="grid-layout">
            <!-- Thông tin cá nhân -->
            <div class="card">
                <h2 class="card-title">Thông Tin Cá Nhân</h2>
                <p class="card-desc">Xem và cập nhật thông tin liên hệ của bạn.</p>

                <div th:if="${profileSuccess}" class="alert-success" th:text="${profileSuccess}"></div>
                <div th:if="${profileError}" class="alert-error" th:text="${profileError}"></div>

                <form action="/profile" method="POST">
                    <div class="form-group">
                        <label>Tài Khoản / Email</label>
                        <input type="text" th:value="${user.email}" readonly>
                        <span class="badge-role" th:text="${user.role.name() == 'ROLE_ADMIN' ? '👑 Thủ Thư (Admin)' : '👤 Độc Giả (Reader)'}"></span>
                    </div>

                    <div class="form-group">
                        <label for="fullName">Họ và Tên</label>
                        <input type="text" id="fullName" name="fullName" th:value="${user.fullName}" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Số Điện Thoại</label>
                        <input type="tel" id="phone" name="phone" th:value="${user.phone}">
                    </div>

                    <div class="form-group">
                        <label for="dateOfBirth">Ngày Sinh</label>
                        <input type="date" id="dateOfBirth" name="dateOfBirth" th:value="${user.dateOfBirth}">
                    </div>

                    <div class="form-group">
                        <label for="address">Địa Chỉ</label>
                        <input type="text" id="address" name="address" th:value="${user.address}">
                    </div>

                    <button type="submit" class="btn btn-primary">Lưu Thay Đổi</button>
                </form>
            </div>

            <!-- Đổi mật khẩu -->
            <div class="card">
                <h2 class="card-title">Đổi Mật Khẩu</h2>
                <p class="card-desc">Cập nhật mật khẩu để bảo vệ tài khoản của bạn.</p>

                <div th:if="${passwordSuccess}" class="alert-success" th:text="${passwordSuccess}"></div>
                <div th:if="${passwordError}" class="alert-error" th:text="${passwordError}"></div>

                <form action="/profile/change-password" method="POST">
                    <div class="form-group">
                        <label for="oldPassword">Mật Khẩu Hiện Tại</label>
                        <input type="password" id="oldPassword" name="oldPassword" placeholder="••••••••" required>
                    </div>

                    <div class="form-group">
                        <label for="newPassword">Mật Khẩu Mới (ít nhất 6 ký tự)</label>
                        <input type="password" id="newPassword" name="newPassword" placeholder="••••••••" minlength="6" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Xác Nhận Mật Khẩu Mới</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" minlength="6" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Đổi Mật Khẩu</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Quản Lý Thư Viện (Library Management System). Xây dựng trên Spring Boot 3 & Java 21.</p>
    </footer>

</body>
</html>
